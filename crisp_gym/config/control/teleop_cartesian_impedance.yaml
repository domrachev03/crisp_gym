# Reference follower Cartesian impedance for legacy local-runtime users. The
# mixed-version FR3 runner does not load parameters across ROS distributions;
# the owning RT PC uses the matching reviewed values in iris-panda-ros2.
limit_error: true
limit_torques: true

max_delta_tau: 2.0

nullspace.stiffness: 5.0

stop_commands: false

variable_max_stiffness.translational: 3200.0
variable_max_stiffness.rotational: 100.0

task.k_pos_x: 400.0
task.k_pos_y: 400.0
task.k_pos_z: 400.0
task.k_rot_x: 30.0
task.k_rot_y: 30.0
task.k_rot_z: 30.0

task.d_pos_x: 90.0
task.d_pos_y: 90.0
task.d_pos_z: 90.0
task.d_rot_x: 3.0
task.d_rot_y: 3.0
task.d_rot_z: 3.0

use_coriolis_compensation: true
use_friction: false
use_gravity_compensation: false
use_local_jacobian: true
use_operational_space: false
use_sim_time: false

filter.target_pose: 0.1
filter.q: 0.1
filter.dq: 0.4
filter.q_ref: 0.1
filter.output_torque: 0.3
