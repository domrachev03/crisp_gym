# Follower cartesian impedance for bilateral teleop.
# Wired from franka_server_standalone/config/control/tuned_cartesian_impedance.yaml
# (the franka_server "tuned" reference). Stiff tracking (k_pos 3000, k_rot 55),
# variable_max_stiffness 3200/100, + the franka_server state/output filters. Nullspace
# kept at the old 5.0 (no damping) and error_clip removed per follower tuning. Loaded onto the follower's
# cartesian_impedance_controller at bilateral start (bilateral/runtime.py).
# Param names match crisp CartesianController (== franka_server default_cartesian_impedance).
limit_error: true
limit_torques: true

max_delta_tau: 2.0

nullspace.stiffness: 5.0

stop_commands: false

variable_max_stiffness.translational: 3200.0
variable_max_stiffness.rotational: 100.0

task.k_pos_x: 3000.0
task.k_pos_y: 3000.0
task.k_pos_z: 3000.0
task.k_rot_x: 55.0
task.k_rot_y: 55.0
task.k_rot_z: 55.0

task.d_pos_x: 90.0
task.d_pos_y: 90.0
task.d_pos_z: 90.0
task.d_rot_x: 3.0
task.d_rot_y: 3.0
task.d_rot_z: 3.0

use_coriolis_compensation: true
use_friction: true
use_gravity_compensation: false
use_local_jacobian: true
use_operational_space: false
use_sim_time: false

filter.target_pose: 0.1
filter.q: 0.1
filter.dq: 0.4
filter.q_ref: 0.1
filter.output_torque: 0.3
