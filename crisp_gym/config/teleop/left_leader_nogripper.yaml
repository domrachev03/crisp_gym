# Left arm as leader, PANDA, no gripper (master haptic device has no dynamixel gripper).
# robot_type panda => panda_joint* names match /left/joint_states (franka/fr3 would read zeros).
leader:
  robot_type: "panda"
  publish_frequency: 50.0
  time_to_home: 2.0
  home_config:
    - -1.73960110e-02
    - 9.55319758e-02
    - 8.09703053e-04
    - -1.94272034
    - -4.01435784e-03
    - 2.06584183
    - 7.97426445e-01

# Gripper disabled (use_gripper: false); this block is required by the schema but unused.
use_gripper: false
leader_gripper:
  min_value: 0.0
  max_value: 1.0
  joint_state_topic: /left/gripper/dynamixel_motor/joint_states
  command_topic: /left/gripper/dynamixel_motor/command
  enable_torque_service: /left/gripper/dynamixel_motor/set_torque

leader_namespace: left
gravity_compensation_controller: control/gravity_compensation.yaml
