# 4-channel (PF-PF): position + force exchanged BOTH ways.
#  - forward position: leader pose -> follower target
#  - return force:     follower wrench -> leader feed-forward
#  - forward force:    leader wrench  -> follower feed-forward
#  - return position:  follower pose  -> leader position spring (k = position_spring_k)
# position_spring_k is a gentle starting value; tune on HW (experiment E4).
scheme: pfpf
mode: cartesian
coupling: absolute
force: true
force_fwd: true
pos_spring: true
tdpa: false
control_frequency: 100.0
delay_steps: 0
feedback_gain: 1.0
feedback_sign: 1.0
feedback_max_force: 20.0
contact_threshold_n: 1.0
reflect_deadband_n: 2.0
reflect_highpass_hz: 0.0
position_spring_k: 150.0
