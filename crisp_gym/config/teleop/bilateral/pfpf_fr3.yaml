# Four-channel PF-PF for the dual-FR3 setup:
#   leader pose   -> follower target
#   follower F/T  -> leader feed-forward wrench
#   leader F/T    -> follower feed-forward wrench
#   follower pose -> leader return-position spring
#
# Keep force_fwd_gain low: on a directly held backdrivable leader, its NetFT also
# observes the reaction to commanded feedback, so the forward-force channel can
# close a positive-feedback loop. The values below preserve the existing PF-PF
# hardware tuning; use CLI overrides to start more gently when commissioning.
scheme: pfpf
mode: cartesian
coupling: absolute
force: true
force_fwd: true
pos_spring: true
tdpa: false
control_frequency: 100.0
delay_steps: 0
feedback_gain: 1.0
feedback_sign: 1.0
feedback_max_force: 30.0
force_fwd_gain: 0.1
contact_threshold_n: 1.0
reflect_deadband_n: 2.0
reflect_highpass_hz: 0.0
position_spring_k: 150.0
rot_spring_k: 3.0

leader_config: fr3_leader_nogripper
leader_namespace: leader
follower_namespace: follower
follower_env_config: fr3_follower_no_cam
leader_wrench_topic: /leader/netft_data_unbiased_tcp
follower_wrench_topic: /follower/netft_data_unbiased_tcp
follower_controller_config: null

# Historical IRIS WorldToBase RPY [0.831, 0.212, 0.155], expressed as XYZW.
leader_base_to_common_quat: [0.4241300075, 0.1557915314, 0.0251414406, 0.8916887334]
follower_base_to_common_quat: [0.0, 0.0, 0.0, 1.0]
