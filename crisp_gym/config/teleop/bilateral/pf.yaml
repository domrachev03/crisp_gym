# Position-force: leader pose -> follower target, follower wrench -> leader.
# HW-validated scheme (soft deadband to null the free-space noise floor).
# feedback_gain lowered 1.0 -> 0.6 to stabilize contact (reflected-force loop gain
# was pumping a ~3Hz limit cycle in the follower's soft rotational impedance).
scheme: pf
mode: cartesian
coupling: absolute
force: true
force_fwd: false
pos_spring: false
tdpa: false
control_frequency: 100.0
delay_steps: 0
feedback_gain: 0.1
feedback_sign: 1.0
feedback_max_force: 2.0
feedback_max_torque: 0.0
contact_threshold_n: 1.0
reflect_deadband_n: 2.0
reflect_deadband_nm: 0.0
reflect_highpass_hz: 0.0
max_translation_m: 0.10
max_rotation_rad: 0.35
max_command_step_m: 0.003
max_command_step_rad: 0.03
leader_config: fr3_leader_nogripper
leader_namespace: leader
follower_namespace: follower
follower_env_config: fr3_follower_no_cam
leader_wrench_topic: /leader/netft_data_unbiased_tcp
follower_wrench_topic: /follower/netft_data_unbiased_tcp
