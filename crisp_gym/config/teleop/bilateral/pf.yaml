# Position-force: leader pose -> follower target, follower wrench -> leader.
# HW-validated scheme (soft deadband to null the free-space noise floor).
# feedback_gain lowered 1.0 -> 0.6 to stabilize contact (reflected-force loop gain
# was pumping a ~3Hz limit cycle in the follower's soft rotational impedance).
scheme: pf
mode: cartesian
coupling: absolute
force: true
force_fwd: false
pos_spring: false
tdpa: false
control_frequency: 100.0
delay_steps: 0
feedback_gain: 0.6
feedback_sign: 1.0
feedback_max_force: 30.0
contact_threshold_n: 1.0
reflect_deadband_n: 2.0
reflect_highpass_hz: 0.0
