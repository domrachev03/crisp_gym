mode: cartesian
coupling: absolute
force: false
force_fwd: false
pos_spring: false
tdpa: false
control_frequency: 100.0
delay_steps: 0
feedback_max_force: 0.0
feedback_max_torque: 0.0
max_translation_m: 0.0
leader_max_translation_m: 0.0
max_rotation_rad: 0.0
max_command_step_m: 0.003
max_command_step_rad: 0.03
leader_config: fr3_leader_nogripper
leader_namespace: leader
follower_namespace: follower
follower_env_config: fr3_follower_no_cam
leader_wrench_topic: /leader/netft_data_unbiased_tcp
