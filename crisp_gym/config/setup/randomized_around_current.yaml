# Episode setup: randomize around a FIXED point = the slave follower TCP pose,
# snapshotted from /right/current_pose on inference_pc (2026-06-21, peg-insert v3).
# XY-plane jitter only -- Z held at the snapshot height (start_jitter.z = 0) -- plus
# yaw about tool z; retract between episodes. To re-snapshot, echo /right/current_pose
# and replace start_center.
enabled: true
home_before_first: false   # explicit center; don't re-home the follower
move_speed: 0.05           # m/s, gentle blocking moves
retract_z_offset: 0.10     # go up ~10 cm after each episode
final_settle_s: 0.5
wait_for_input: false       # the recording manager's start key gates the episode

seed: 0                     # reproducible jitter (seed + episode_index)

start_center:
  position: [0.45518998, -0.02420440, 0.12884997]
  quaternion_xyzw: [0.97345599, -0.22821375, 0.01712170, 0.00296255]

start_jitter:
  x: 0.05                  # +- m
  y: 0.05
  z: 0.0                   # keep Z fixed at the snapshot height (XY-plane only)
  yaw_deg: 10.0            # +- deg about tool z
