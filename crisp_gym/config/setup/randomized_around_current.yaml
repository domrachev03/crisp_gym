# Episode setup: randomize around a FIXED point = the slave follower TCP pose,
# snapshotted from /right/current_pose on inference_pc (2026-06-11). Same
# randomization as lerobot-panda (uniform xyz jitter + yaw about z), retract between
# episodes. To re-snapshot, echo /right/current_pose and replace start_center.
enabled: true
home_before_first: false   # explicit center; don't re-home the follower
move_speed: 0.05           # m/s, gentle blocking moves
retract_z_offset: 0.10     # go up ~10 cm after each episode
final_settle_s: 0.5
wait_for_input: false       # the recording manager's start key gates the episode

seed: 0                     # reproducible jitter (seed + episode_index)

start_center:
  position: [0.45793572, -0.02236707, 0.20625054]
  quaternion_xyzw: [0.94033175, -0.33866609, 0.00776405, 0.03195616]

start_jitter:
  x: 0.05                  # +- m
  y: 0.05
  z: 0.02
  yaw_deg: 10.0            # +- deg about tool z
